<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" /> <!-- Very dark slate -->
      <stop offset="100%" stop-color="#000000" /> <!-- Black -->
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Brand Gradient for the icon (Indigo to Pink) -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" /> <!-- Indigo -->
      <stop offset="50%" stop-color="#a855f7" /> <!-- Purple -->
      <stop offset="100%" stop-color="#ec4899" /> <!-- Pink -->
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" /> <!-- Cyan -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Blue -->
    </linearGradient>
  </defs>

  <!-- Base Dark Premium Rounded Rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  
  <!-- Subtle inner border for glass effect -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.08" />

  <!-- Glow orb behind everything -->
  <circle cx="256" cy="256" r="100" fill="#a855f7" opacity="0.25" filter="url(#glow-heavy)" />

  <!-- Back ring/swoosh -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accent-grad)" stroke-width="32" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="600" stroke-dashoffset="150" opacity="0.8"/>

  <!-- Front Dynamic Checkmark -->
  <path d="M 170 256 L 230 320 L 360 170" fill="none" stroke="url(#icon-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- White highlight inside checkmark for sleek 3D/neon effect -->
  <path d="M 170 256 L 230 320 L 360 170" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- A spark / star in the top right -->
  <path d="M 370 110 Q 385 110 385 95 Q 385 110 400 110 Q 385 110 385 125 Q 385 110 370 110 Z" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- A smaller spark in the bottom left -->
  <path d="M 120 370 Q 130 370 130 360 Q 130 370 140 370 Q 130 370 130 380 Q 130 370 120 370 Z" fill="#06b6d4" filter="url(#glow)"/>
</svg>